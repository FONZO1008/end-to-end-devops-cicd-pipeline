---
- name: Deploy Docker App
  hosts: app
  become: yes

  vars:
    image_uri: "303192503865.dkr.ecr.ap-south-1.amazonaws.com/my-app:7"

  tasks:

    - name: Update yum packages
      yum:
        name: "*"
        state: latest

    - name: Install Docker
      yum:
        name: docker
        state: present

    - name: Install AWS CLI
      yum:
        name: awscli
        state: present

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Login to AWS ECR
      shell: |
        aws ecr get-login-password --region ap-south-1 | \
        docker login --username AWS --password-stdin 303192503865.dkr.ecr.ap-south-1.amazonaws.com

    - name: Pull latest Docker image
      shell: docker pull {{ image_uri }}

    - name: Stop existing container
      shell: docker stop my-app || true

    - name: Remove existing container
      shell: docker rm my-app || true

    - name: Remove old Docker images
      shell: docker image prune -af || true

    - name: Run Docker container
      shell: |
        docker run -d \
        --name my-app \
        -p 3000:3000 \
        --restart always \
        {{ image_uri }}

    - name: Verify container is running
      shell: docker ps
      register: docker_output

    - name: Show running containers
      debug:
        var: docker_output.stdout_lines
